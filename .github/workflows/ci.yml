name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness
    permissions:
      contents: read
    uses: aoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoa/eternalist-foundry/.github/workflows/pipeline.yml@c56eab169403d94596c0bce8925dcc1938eb74c5
    with:
      namespace: harness
      publish: false

  witness:
    name: Witness
    permissions:
      contents: read
    uses: aoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoa/eternalist-foundry/.github/workflows/pipeline.yml@c56eab169403d94596c0bce8925dcc1938eb74c5
    with:
      contract: foundry-witness.toml
      namespace: witness
      publish: false
